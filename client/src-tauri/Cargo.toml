[package]
name = "slopcall"
version = "0.1.0"
description = "Slopcall - tiny voice and text rooms"
authors = ["Slopcall"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "slopcall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
